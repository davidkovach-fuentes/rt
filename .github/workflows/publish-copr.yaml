name: Publish to Copr

on:
  workflow_call:
    inputs:
      version:
        description: Release tag or version string (e.g. v0.1.8)
        type: string
        required: true
    secrets:
      COPR_LOGIN:
        required: false
      COPR_USERNAME:
        required: false
      COPR_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release tag or version string (e.g. v0.1.8)
        type: string
        required: true

permissions:
  contents: write

jobs:
  copr:
    runs-on: ubuntu-latest
    env:
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
      # Single source of truth for the NVR: the release/tag passed by the caller.
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Prefer the release tag when it exists so the tree matches the NVR.
          ref: ${{ inputs.version }}
          fetch-depth: 1
          fetch-tags: true

      - name: Show version
        run: |
          echo "VERSION=$VERSION"
          echo "github.ref=$GITHUB_REF"
          echo "github.ref_name=$GITHUB_REF_NAME"
          echo "github.sha=$GITHUB_SHA"

      - name: Install dependencies
        if: env.COPR_TOKEN != ''
        run: |
          sudo apt update
          sudo apt install -y rpm make python3-pip
          pip install --user copr-cli
          pip install --user tito
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Copr config
        if: env.COPR_TOKEN != ''
        run: |
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = ${COPR_LOGIN}"
            echo "username = ${COPR_USERNAME}"
            echo "token = ${COPR_TOKEN}"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Build SRPM
        if: env.COPR_TOKEN != ''
        run: |
          test -f scripts/build-srpm.sh
          test -f .copr/Makefile
          test -n "$VERSION"
          VERSION="$VERSION" bash scripts/build-srpm.sh "$PWD/pkg/linux/fedora/artifacts"
          ls -la pkg/linux/fedora/artifacts/
          # Guard against accidentally uploading a stale NVR.
          ls pkg/linux/fedora/artifacts/atlas-rt-*.src.rpm
          VER_NUM="${VERSION#v}"
          VER_NUM="${VER_NUM#atlas-rt-}"
          VER_NUM="${VER_NUM%%-*}"
          ls pkg/linux/fedora/artifacts/atlas-rt-"${VER_NUM}"-*.src.rpm

      - name: Submit to Copr
        if: env.COPR_TOKEN != ''
        run: |
          VER_NUM="${VERSION#v}"
          VER_NUM="${VER_NUM#atlas-rt-}"
          VER_NUM="${VER_NUM%%-*}"
          SRPM=$(ls pkg/linux/fedora/artifacts/atlas-rt-"${VER_NUM}"-*.src.rpm | head -n1)
          if [ -z "$SRPM" ]; then
            echo "No SRPM for version ${VER_NUM} under pkg/linux/fedora/artifacts/"
            ls -la pkg/linux/fedora/artifacts/ || true
            exit 1
          fi
          echo "Submitting $SRPM (version=${VER_NUM})"
          cat .tito/packages/atlas-rt
          # --nowait: submit and exit; do not block the workflow on the remote build.
          copr-cli build --nowait "${COPR_USERNAME}/atlas-rt" "$SRPM"

      - name: Skip when Copr secrets are missing
        if: env.COPR_TOKEN == ''
        run: echo "COPR_TOKEN is unset; skipping Copr publish."
