name: Publish to Copr

on:
  workflow_call:
    inputs:
      version:
        description: Release tag or version string (e.g. v0.1.5)
        type: string
        required: false
        default: ""
    secrets:
      COPR_LOGIN:
        required: false
      COPR_USERNAME:
        required: false
      COPR_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release tag or version string (e.g. v0.1.5)
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  copr:
    runs-on: ubuntu-latest
    env:
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
      VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        if: env.COPR_TOKEN != ''
        run: |
          sudo apt update
          sudo apt install -y rpm make python3-pip
          pip install --user copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Copr config
        if: env.COPR_TOKEN != ''
        run: |
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = ${COPR_LOGIN}"
            echo "username = ${COPR_USERNAME}"
            echo "token = ${COPR_TOKEN}"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Build SRPM
        if: env.COPR_TOKEN != ''
        run: |
          test -f scripts/build-srpm.sh
          test -f .copr/Makefile
          VERSION="${VERSION}" bash scripts/build-srpm.sh "$PWD/pkg/linux/fedora/artifacts"
          ls -la pkg/linux/fedora/artifacts/

      - name: Submit to Copr
        if: env.COPR_TOKEN != ''
        run: |
          SRPM=$(ls pkg/linux/fedora/artifacts/atlas-rt-*.src.rpm | head -n1)
          if [ -z "$SRPM" ]; then
            echo "No SRPM under pkg/linux/fedora/artifacts/"
            ls -la pkg/linux/fedora/artifacts/ || true
            exit 1
          fi
          echo "Submitting $SRPM"
          copr-cli build "${COPR_USERNAME}/atlas-rt" "$SRPM"

      - name: Skip when Copr secrets are missing
        if: env.COPR_TOKEN == ''
        run: echo "COPR_TOKEN is unset; skipping Copr publish."
