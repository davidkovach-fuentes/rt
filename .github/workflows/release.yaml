name: Build and Release Packages

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOL: ${{ github.event.repository.name }}
  DESC: An overlay type system for shell pipelines
  VERSION: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    # secrets cannot be referenced in `if:`; map to env and gate on that.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Prefer the triggering ref; only pin to a release tag when one exists.
          ref: ${{ github.event.release.tag_name || github.sha }}
          # git archive only needs HEAD; full history made checkout hang on large repos.
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y ruby ruby-dev build-essential rpm rpm2cpio make python3-pip
          sudo gem install --no-document fpm
          pip install --user copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Packages
        run: |
          VERSION="${VERSION#v}" \
          REPO="${{ github.repository }}" \
          RT_PACKAGE_MAINTAINER="atlas@brown.edu" \
          bash scripts/build-packages.sh

      # Homebrew downloads GitHub's tag archive; sha256 must match that URL (not git archive).
      - name: URL and SHA256
        run: |
          TAG="${VERSION}"
          VER="${TAG#v}"
          URL="${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Version URL SHA
        run: |
          echo "VERSION=$VER"
          echo "URL=$URL"
          echo "SHA256=$SHA256"

      - name: Set up Git
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: atlas-brown/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          FORMULA_FILE=homebrew-tap/Formula/$TOOL.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA_FILE"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" "$FORMULA_FILE"
          sed -i "s|version \".*\"|version \"${VER}\"|" "$FORMULA_FILE"

      - name: Commit & Push Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          cd homebrew-tap
          git add Formula/$TOOL.rb
          git commit -m "Update $TOOL formula to $VER" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}

      # Copr: use make_srpm (.copr/Makefile), not tito — full-repo archive includes scripts/.
      - name: Configure Copr credentials
        if: env.COPR_TOKEN != ''
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          # Strip leading indentation so the INI parses cleanly.
          sed -i 's/^[[:space:]]*//' ~/.config/copr
          chmod 600 ~/.config/copr
          # Sanity: do not print secrets; just confirm keys exist.
          grep -E '^(login|username|token|copr_url) =' ~/.config/copr | sed 's/= .*/= ***/'

      - name: Build SRPM
        if: env.COPR_TOKEN != ''
        run: |
          test -f pkg/linux/fedora/build-srpm.sh
          test -f .copr/Makefile
          bash pkg/linux/fedora/build-srpm.sh "$PWD/pkg/linux/fedora/dist"
          ls -la pkg/linux/fedora/dist/

      - name: Publish to Copr
        if: env.COPR_TOKEN != ''
        run: |
          SRPM=$(ls pkg/linux/fedora/dist/atlas-rt-*.src.rpm | head -n1)
          if [ -z "$SRPM" ]; then
            echo "No SRPM found in pkg/linux/fedora/dist/"
            ls -la pkg/linux/fedora/dist/ || true
            exit 1
          fi
          echo "Submitting $SRPM to Copr..."
          # Project is usually OWNER/NAME on Copr
          copr-cli build "${COPR_USERNAME}/atlas-rt" "$SRPM"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            pkg/linux/dist/*.deb
            pkg/linux/dist/*.rpm
            pkg/linux/fedora/dist/*.src.rpm
          fail_on_unmatched_files: false
