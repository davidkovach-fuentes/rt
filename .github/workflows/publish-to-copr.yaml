name: Publish to Copr

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.1.8). Leave blank to auto-bump the patch.'
        required: false
        type: string

permissions:
  contents: write

env:
  TOOL: atlas-rt

jobs:
  tito-tag:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Install git
        working-directory: /
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Install packaging tools
        working-directory: /
        run: dnf install -y rpm-build tito

      - name: Configure git
        run: |
          set -eux
          git config --global --add safe.directory "${{ github.workspace }}"
          git config --global --add safe.directory "*"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git status -sb
          tito --version

      - name: Ensure baseline tito tag exists
        run: |
          set -euo pipefail
          pkg_file=".tito/packages/${TOOL}"
          claimed="$(awk '{print $1; exit}' "$pkg_file")"
          tag="${TOOL}-${claimed}"
          echo "packages claims ${tag}"
          git tag -l "${TOOL}-*" | sort -V | tail -20 || true

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Baseline tag ${tag} present"
            exit 0
          fi

          latest="$(git tag -l "${TOOL}-*" | sort -V | tail -1 || true)"
          if [[ -n "${latest}" ]]; then
            echo "Missing ${tag}; aligning packages to existing ${latest}"
            echo "${latest#${TOOL}-} ./" > "$pkg_file"
            exit 0
          fi

          root="$(git rev-list --max-parents=0 HEAD | tail -1)"
          echo "Seeding local baseline tag ${tag} at ${root}"
          git tag "${tag}" "${root}"

      - name: Tito check
        run: |
          test -f atlas-rt.spec
          test -f .tito/tito.props
          test -f ".tito/packages/${TOOL}"
          tito --version

      - name: Test build (tito --test)
        run: |
          OUTDIR=/tmp/tito-test
          mkdir -p "$OUTDIR"
          tito build --test --rpm --output="$OUTDIR"
          ls -la "$OUTDIR"

      - name: Resolve version
        id: ver
        run: |
          raw='${{ inputs.version }}'
          raw="${raw#v}"
          raw="${raw#atlas-rt-}"
          if [[ "$raw" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tito tag
        run: |
          if [[ -n "${{ steps.ver.outputs.version }}" ]]; then
            tito tag --use-version="${{ steps.ver.outputs.version }}" --accept-auto-changelog
          else
            tito tag --accept-auto-changelog
          fi

      - name: Show new tag
        run: |
          cat ".tito/packages/${TOOL}"
          git describe --tags --abbrev=0
          git log -1 --oneline

      - name: Push commit and tag
        run: git push --follow-tags origin HEAD:fpm-ubuntu-fedora
