name: Publish to Copr

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.1.8). Leave blank to auto-bump the patch.'
        required: false
        type: string

permissions:
  contents: write

env:
  TOOL: atlas-rt

jobs:
  tito-tag:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      # fedora:latest has no git; install before any git/tito command.
      - name: Install dependencies
        run: |
          dnf install -y rpm-build git tito
          tito --version

      # Container is root; checkout files are owned by the runner user.
      - name: Trust git worktree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"
          git rev-parse --show-toplevel
          git status -sb

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tito check
        run: |
          test -f atlas-rt.spec
          test -f .tito/tito.props
          test -f ".tito/packages/${TOOL}"
          tito check

      - name: Test build (tito --test)
        run: |
          OUTDIR="${RUNNER_TEMP:-/tmp}/tito-test"
          mkdir -p "$OUTDIR"
          tito build --test --rpm --output="$OUTDIR"
          ls -la "$OUTDIR"

      - name: Resolve version
        id: ver
        run: |
          raw='${{ inputs.version }}'
          raw="${raw#v}"
          raw="${raw#atlas-rt-}"
          if [[ "$raw" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tito tag
        run: |
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            tito tag --use-version="${{ steps.ver.outputs.version }}" --accept-auto-changelog
          else
            tito tag --accept-auto-changelog
          fi

      - name: Show new tag
        run: |
          echo "tito packages:"
          cat ".tito/packages/${TOOL}"
          echo "new tag: $(git describe --tags --abbrev=0)"
          git log -1 --oneline

      - name: Push commit and tag
        run: git push --follow-tags origin HEAD
